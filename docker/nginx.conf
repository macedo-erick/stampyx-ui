# Host nginx forwards /ui/ here verbatim, so this server owns the prefix end to end.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Otherwise nginx builds Location headers from port 8080 rather than the public one.
    absolute_redirect off;

    # Caching index.html would pin clients to a previous deploy's bundles.
    location = /ui/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Exactly 8 hash characters, so unhashed assets from public/ stay out of the immutable
    # bucket. Quoted because nginx would otherwise read {8} as a block delimiter.
    location ~* "^/ui/.+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback. Also serves /ui/silent-check-sso.html for the hidden refresh iframe.
    location /ui/ {
        try_files $uri $uri/ /ui/index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /ui/;
    }
}
