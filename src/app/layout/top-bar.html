<ng-container *transloco="let t">
  <a class="brand" routerLink="/inbox">
    <span class="brand-mark" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        width="17"
        height="17"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"></rect>
        <path d="M3.6 6.6 12 13l8.4-6.4"></path>
      </svg>
    </span>
    Stampyx
  </a>

  <label class="search">
    <svg
      viewBox="0 0 24 24"
      width="15"
      height="15"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-3.5-3.5"></path>
    </svg>
    <input
      type="search"
      [attr.placeholder]="t('inbox.search')"
      [attr.aria-label]="t('inbox.search')"
    />
  </label>

  <div class="actions">
    <button
      type="button"
      class="icon-button"
      (click)="theme.toggle()"
      [attr.aria-label]="t(theme.isDark() ? 'theme.toLight' : 'theme.toDark')"
    >
      <svg
        viewBox="0 0 24 24"
        width="17"
        height="17"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        @if (theme.isDark()) {
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
        } @else {
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
          ></path>
        }
      </svg>
    </button>

    <button
      type="button"
      class="icon-button"
      (click)="auth.logout()"
      [attr.aria-label]="t('nav.signOut')"
    >
      <svg
        viewBox="0 0 24 24"
        width="17"
        height="17"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path>
      </svg>
    </button>

    <span class="avatar" [attr.title]="auth.email()">{{ auth.initials() }}</span>
  </div>
</ng-container>
