<stampyx-top-bar />

<div class="flex min-h-0 flex-1">
  <stampyx-sidebar />

  <main class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <router-outlet />
  </main>
</div>

<p-toast position="bottom-right" />

<!-- ConfirmationService only posts an event: without this rendered, every confirm() was a silent
     no-op. Headless, so PrimeNG keeps the mask, focus trap and Escape while the panel stays ours. -->
<p-confirmdialog [style]="{ width: '25rem' }">
  <ng-template #headless let-confirmation let-onAccept="onAccept" let-onReject="onReject">
    <div class="stx-card stx-confirm" *transloco="let t">
      <span class="stx-eyebrow">{{ confirmation.header ?? t('common.confirm') }}</span>
      <p class="stx-confirm-body">{{ confirmation.message }}</p>

      <div class="stx-confirm-actions">
        <button type="button" class="stx-pill stx-pill--quiet" (click)="onReject()">
          {{ confirmation.rejectLabel ?? t('common.cancel') }}
        </button>
        <button
          type="button"
          class="stx-pill"
          [class]="confirmation.acceptButtonStyleClass ?? ''"
          (click)="onAccept()"
        >
          {{ confirmation.acceptLabel ?? t('common.confirm') }}
        </button>
      </div>
    </div>
  </ng-template>
</p-confirmdialog>
