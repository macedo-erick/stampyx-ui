<ng-container *transloco="let t">
  <button type="button" class="stx-pill compose" (click)="compose()">
    <svg
      viewBox="0 0 24 24"
      width="16"
      height="16"
      fill="none"
      stroke="currentColor"
      stroke-width="2.4"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M12 5v14M5 12h14"></path>
    </svg>
    {{ t('inbox.compose') }}
  </button>

  <nav class="section" [attr.aria-label]="t('folders.title')">
    <div class="section-head">
      <span class="stx-eyebrow">{{ t('folders.title') }}</span>
      <a class="section-add" routerLink="/folders" [attr.aria-label]="t('folders.add')">
        <svg
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
        >
          <path d="M12 5v14M5 12h14"></path>
        </svg>
      </a>
    </div>

    @for (row of systemFolders(); track row.path) {
      <button
        type="button"
        class="row"
        [class.is-active]="row.path === context.folder()"
        (click)="openFolder(row)"
      >
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path [attr.d]="iconFor(row)"></path>
        </svg>
        <span class="row-label">{{
          t('folders.system.' + row.path.toLowerCase(), { name: row.name })
        }}</span>
        @if (badge(row) > 0) {
          <span class="count" [class.is-unread]="row.unread > 0">{{ badge(row) }}</span>
        }
      </button>
    }

    @for (row of ownFolders(); track row.path) {
      <button
        type="button"
        class="row"
        [class.is-active]="row.path === context.folder()"
        [class.row-nested]="row.parent !== null"
        (click)="openFolder(row)"
      >
        <span class="dot" aria-hidden="true"></span>
        <span class="row-label">{{ row.name }}</span>
        @if (badge(row) > 0) {
          <span class="count" [class.is-unread]="row.unread > 0">{{ badge(row) }}</span>
        }
      </button>
    }
  </nav>

  <nav class="section" [attr.aria-label]="t('nav.primary')">
    <div class="section-head">
      <span class="stx-eyebrow">{{ t('nav.manage') }}</span>
    </div>

    <a class="row" routerLink="/rules" routerLinkActive="is-active">
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path>
      </svg>
      <span class="row-label">{{ t('nav.rules') }}</span>
    </a>

    @if (canManageDomains()) {
      <a class="row" routerLink="/domains" routerLinkActive="is-active">
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path
            d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
          ></path>
        </svg>
        <span class="row-label">{{ t('nav.domains') }}</span>
      </a>
    }

    <a class="row" routerLink="/settings" routerLinkActive="is-active">
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
        ></path>
      </svg>
      <span class="row-label">{{ t('nav.settings') }}</span>
    </a>

    @if (me.isAdmin()) {
      <a class="row" routerLink="/admin" routerLinkActive="is-active">
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span class="row-label">{{ t('nav.admin') }}</span>
      </a>
    }
  </nav>

  <!-- Displaced from the top bar under the breakpoint, where the search field leaves it no
       room. Hidden above it, so the two never show at once. -->
  <div class="drawer-footer">
    <button type="button" class="row" (click)="theme.toggle()" [attr.aria-pressed]="theme.isDark()">
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        @if (theme.isDark()) {
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
        } @else {
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
          ></path>
        }
      </svg>
      <span class="row-label">{{ t(theme.isDark() ? 'theme.toLight' : 'theme.toDark') }}</span>
    </button>

    <button type="button" class="row" (click)="auth.logout()">
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path>
      </svg>
      <span class="row-label">{{ t('nav.signOut') }}</span>
    </button>
  </div>
</ng-container>
